name: Снимок для УНФ (dry-run)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверить тесты
        run: node --test

      - name: Сформировать снимок для УНФ
        env:
          BUH_BASE: ${{ secrets.BUH_BASE }}
          BUH_USER: ${{ secrets.BUH_USER }}
          BUH_PASS: ${{ secrets.BUH_PASS }}
          BUH_ORG:  ${{ secrets.BUH_ORG }}
          UNF_BASE: ${{ secrets.UNF_BASE }}
          UNF_USER: ${{ secrets.UNF_USER }}
          UNF_PASS: ${{ secrets.UNF_PASS }}
          UNF_ORG:  ${{ secrets.UNF_ORG }}
        run: node scripts/push-report.mjs

      - name: Сохранить снимок
        uses: actions/upload-artifact@v4
        with:
          name: unf-snapshot
          path: out/snapshot.json
          retention-days: 7
